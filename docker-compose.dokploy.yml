
services:
  ybb-program-next:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        APP_BUILD_ID: ${APP_BUILD_ID}
        NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
        NEXT_PUBLIC_BRAND_DOMAIN: ${NEXT_PUBLIC_BRAND_DOMAIN}
    container_name: ybb-prod-program-next
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_BUILD_ID=${APP_BUILD_ID}
      - NEXT_PUBLIC_S3_URL=${NEXT_PUBLIC_S3_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
      - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
      - NEXT_PUBLIC_BRAND_DOMAIN=${NEXT_PUBLIC_BRAND_DOMAIN}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      # Shared with the API, which POSTs the revalidate hooks on admin edits.
      # Without these the routes 500 in production and no admin change ever
      # reaches the public site until a redeploy.
      - SETTINGS_REVALIDATE_SECRET=${SETTINGS_REVALIDATE_SECRET}
      - HOME_REVALIDATE_SECRET=${HOME_REVALIDATE_SECRET}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.ybb-program-next.loadbalancer.server.port=3000
      # middleeastyouthsummit.com
      - traefik.http.routers.ybb-program-next-meys.rule=Host(`middleeastyouthsummit.com`)
      - traefik.http.routers.ybb-program-next-meys.entrypoints=websecure
      - traefik.http.routers.ybb-program-next-meys.tls.certresolver=letsencrypt
      - traefik.http.routers.ybb-program-next-meys.service=ybb-program-next
      - traefik.http.routers.ybb-program-next-meys-http.rule=Host(`middleeastyouthsummit.com`)
      - traefik.http.routers.ybb-program-next-meys-http.entrypoints=web
      - traefik.http.routers.ybb-program-next-meys-http.middlewares=redirect-to-https@file
      # chinayouthsummit.com
      - traefik.http.routers.ybb-program-next-china.rule=Host(`chinayouthsummit.com`)
      - traefik.http.routers.ybb-program-next-china.entrypoints=websecure
      - traefik.http.routers.ybb-program-next-china.tls.certresolver=letsencrypt
      - traefik.http.routers.ybb-program-next-china.service=ybb-program-next
      - traefik.http.routers.ybb-program-next-china-http.rule=Host(`chinayouthsummit.com`)
      - traefik.http.routers.ybb-program-next-china-http.entrypoints=web
      - traefik.http.routers.ybb-program-next-china-http.middlewares=redirect-to-https@file
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
